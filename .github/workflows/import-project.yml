name: Import project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Set up project import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Check out source project
        uses: actions/checkout@v4
        with:
          repository: raulwulff6769/framework-lab
          ref: hoplite/plataia-11be29af--stand
          path: source

      - name: Copy project and push
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-project.yml' \
            source/ destination/
          cd destination
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import plataia stand project'
          git push
