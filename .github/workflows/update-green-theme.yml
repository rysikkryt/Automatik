name: Update green theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Switch site accent from orange to green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace orange accent with green
        run: |
          sed -i 's/#d87943/#46a171/g; s/#e78a53/#72bc8f/g' platform/src/styles.css platform/public/favicon.svg
          convert -background none platform/public/favicon.svg -resize 192x192 platform/public/icon-192.png
          convert -background none platform/public/favicon.svg -resize 512x512 platform/public/icon-512.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/src/styles.css platform/public/favicon.svg platform/public/icon-192.png platform/public/icon-512.png
          git commit -m 'Apply green site theme'
          git push
